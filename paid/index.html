<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="lemango-api-base" content="https://lemango-org.onrender.com">
  <script src="/api-base.js"></script>
  <title>Lamda LaunchPad — Lemango</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; }
    .box { text-align: center; max-width: 440px; padding: 24px; }
    a { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Lamda LaunchPad</h1>
    <p id="msg">Checking access…</p>
    <p><a href="/payments">← Back to Lemango</a></p>
  </div>
  <script>
    (function () {
      var base = (window.LEMANGO_API_BASE || "").replace(/\/+$/, "");
      var u = null;
      try { u = JSON.parse(localStorage.getItem("lemango_user") || "null"); } catch (e) {}
      if (u && u.idToken) {
        location.replace((base || "") + "/paid?idToken=" + encodeURIComponent(u.idToken));
      } else {
        document.getElementById("msg").innerHTML =
          'This is a <strong>paid product</strong>. ' +
          '<a href="/auth?next=%2Fpaid">Sign in</a> with an authorized account to open it.';
      }
    })();
  </script>
</body>
</html>
