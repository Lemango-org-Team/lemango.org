<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffaf0">
  <title>Lemango — Invite</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/lemango-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/a11y.css">
  <meta name="lemango-api-base" content="https://lemango-org.onrender.com">
  <script src="/api-base.js"></script>
  <script src="/lemango-auth.js" defer></script>
</head>
<body class="dark">
  <div id="invite-overlay" style="position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;">
    <div style="font-size:18px;font-weight:700;">Verifying invite...</div>
    <div style="font-size:13px;color:#94a3b8;">Please wait while we check your access.</div>
  </div>
  <main style="padding:40px;text-align:center;">
    <h1>Lemango</h1>
    <p>Checking your invite...</p>
  </main>
  <script>
    (async function () {
      const overlay = document.getElementById("invite-overlay");
      const params = new URLSearchParams(location.search);
      const token = params.get("token");
      if (!token) { location.replace("/404"); return; }

      // Wait for auth module
      await new Promise((resolve) => {
        if (window.LemangoAuth) resolve();
        else document.addEventListener("lm:auth", resolve, { once: true });
        setTimeout(resolve, 2000);
      });

      const user = window.LemangoAuth && window.LemangoAuth.user;
      if (!user) {
        // Prompt login
        location.replace("/auth.html?next=" + encodeURIComponent("/invite?token=" + token));
        return;
      }

      // Verify invite (background)
      try {
        const res = await fetch("/api/admin/verify-invite", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ token, idToken: user.idToken })
        });
        const data = await res.json();
        if (!res.ok) {
          if (data.wrongUser) { location.replace("/404"); return; }
          if (data.needLogin) { location.replace("/auth.html?next=" + encodeURIComponent("/invite?token=" + token)); return; }
          overlay.innerHTML = `<div style="font-size:18px;font-weight:700;color:#f87171;">Access denied</div><div style="font-size:13px;color:#94a3b8;margin-top:8px;">${data.error || "Invalid invite"}</div>`;
          return;
        }
        // Queued — show waiting UI
        overlay.innerHTML = `
          <div style="font-size:18px;font-weight:700;color:#34d399;">You're in the queue</div>
          <div style="font-size:13px;color:#94a3b8;margin-top:8px;max-width:400px;text-align:center;">
            Your request has been submitted. An admin must approve your access.
            Safety score: ${data.safety ? data.safety.score : "N/A"}${data.safety && data.safety.score < 90 ? " (below 90 — admin confirmation required)" : ""}.
          </div>
          <div id="tos-block" style="margin-top:16px;max-width:400px;text-align:center;">
            <label style="font-size:12px;color:#cbd5e1;display:flex;align-items:center;gap:8px;justify-content:center;">
              <input type="checkbox" id="tosCheck"> I accept the <a href="/terms.html" target="_blank" style="color:#34d399;">Terms</a> and <a href="/privacy.html" target="_blank" style="color:#34d399;">Privacy Policy</a>
            </label>
            <button id="acceptTosBtn" style="margin-top:10px;padding:8px 16px;background:#007a33;color:#fff;border:none;border-radius:6px;font-weight:700;cursor:pointer;">Accept & Continue</button>
          </div>
          <div id="status-msg" style="margin-top:12px;font-size:12px;color:#94a3b8;"></div>
        `;
        const acceptBtn = document.getElementById("acceptTosBtn");
        if (acceptBtn) {
          acceptBtn.addEventListener("click", async () => {
            const cb = document.getElementById("tosCheck");
            if (!cb || !cb.checked) { alert("Please accept the Terms and Privacy Policy."); return; }
            try {
              const r = await fetch("/api/admin/accept-tos", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: JSON.stringify({ token, idToken: user.idToken })
              });
              const d = await r.json();
              if (d.ok) {
                document.getElementById("status-msg").textContent = "TOS accepted. Waiting for admin approval...";
              } else {
                document.getElementById("status-msg").textContent = d.error || "Failed";
              }
            } catch (e) {
              document.getElementById("status-msg").textContent = "Error: " + e.message;
            }
          });
        }
        // Poll status
        const poll = setInterval(async () => {
          try {
            const r = await fetch("/api/admin/status?token=" + encodeURIComponent(token) + "&idToken=" + encodeURIComponent(user.idToken), { credentials: "include" });
            const d = await r.json();
            if (d.ok && d.entry && d.entry.status === "approved") {
              clearInterval(poll);
              overlay.innerHTML = `<div style="font-size:18px;font-weight:700;color:#34d399;">Access granted!</div><div style="font-size:13px;color:#94a3b8;margin-top:8px;">You are now an admin. Redirecting...</div>`;
              setTimeout(() => { location.replace("/admin"); }, 1500);
            } else if (d.ok && d.entry && d.entry.status === "rejected") {
              clearInterval(poll);
              location.replace("/404");
            }
          } catch (e) { /* ignore */ }
        }, 5000);
      } catch (e) {
        overlay.innerHTML = `<div style="font-size:18px;font-weight:700;color:#f87171;">Error</div><div style="font-size:13px;color:#94a3b8;margin-top:8px;">${e.message}</div>`;
      }
    })();
  </script>
  <script src="/admin-button.js" defer></script>
</body>
</html>
