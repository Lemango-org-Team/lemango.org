<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign in — Lemango</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a class="auth-brand" href="/" aria-label="Back to Lemango">
        <img src="assets/lemango-flag.webp" width="36" height="24" alt="">
        <span>le<em>mango</em></span>
      </a>

      <div class="auth-body">
        <h1>Sign in to Lemango</h1>
        <p class="auth-sub">Use your Google account to sign in. No password needed.</p>

        <div class="auth-error" id="auth-error" aria-live="polite" hidden></div>

        <a class="google-btn" id="google-btn" href="/api/auth/google">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continue with Google
        </a>

        <p class="auth-terms">
          By signing in you agree to Lemango's
          <a href="/terms.html">Terms of Service</a> and
          <a href="/privacy.html">Privacy Policy</a>.
        </p>
      </div>
    </div>

    <p class="auth-footer-note">
      <a href="/">← Back to Lemango</a>
    </p>
  </div>

  <script>
    // Show error from query string if present
    const params = new URLSearchParams(location.search);
    const err = params.get("error");
    const msgs = {
      access_denied:  "You declined the sign-in request.",
      invalid_state:  "Sign-in session expired. Please try again.",
      no_code:        "Something went wrong with Google. Please try again.",
      server_error:   "A server error occurred. Please try again in a moment.",
    };
    if (err) {
      const el = document.getElementById("auth-error");
      el.textContent = msgs[err] || "An unexpected error occurred.";
      el.hidden = false;
    }

    // Pass ?next= through to the API
    const next = params.get("next");
    if (next) {
      const btn = document.getElementById("google-btn");
      btn.href = `/api/auth/google?next=${encodeURIComponent(next)}`;
    }
  </script>
</body>
</html>
